  <body class="bg-slate-900 text-slate-800 antialiased font-sans">
    <div id="root">
      <div class="fallback-loader" style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at top left, #1e1b4b, #0f172a 70%);">
        <div style="width: 38px; height: 38px; border: 3px solid rgba(255,255,255,0.15); border-top-color: #38bdf8; border-radius: 50%; animation: spinLoader 0.8s linear infinite;"></div>
        <style>@keyframes spinLoader { to { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      setTimeout(function() {
        var root = document.getElementById('root');
        if (root && root.querySelector('.fallback-loader')) {
          root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#090d16;color:#fff;font-family:system-ui,-apple-system,sans-serif;padding:20px;text-align:center;"><div style="max-width:380px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);padding:28px;border-radius:20px;"><div style="width:48px;height:48px;background:#2563eb;border-radius:14px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:20px;">⚡</div><h2 style="font-size:18px;margin-bottom:8px;font-weight:700;">Menyiapkan Antarmuka...</h2><p style="font-size:13px;color:#94a3b8;margin-bottom:16px;">Jika halaman belum tampil sempurna, silakan klik tombol di bawah untuk memuat ulang.</p><button onclick="window.location.reload();" style="background:#2563eb;color:#fff;border:none;padding:10px 20px;border-radius:10px;font-weight:700;cursor:pointer;font-size:13px;">Segarkan Halaman</button></div></div>';
        }
      }, 4000);
    </script>
