<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agenda Surat Sekolah</title>
    <meta name="description" content="Aplikasi manajemen agenda surat masuk dan surat keluar sekolah modern, aman, responsif dengan penyimpanan berkas permanen dan ekspor data." />
    <meta property="og:title" content="Agenda Surat Sekolah" />
    <meta property="og:description" content="Aplikasi manajemen agenda surat masuk dan surat keluar sekolah modern, aman, responsif dengan penyimpanan berkas permanen dan ekspor data." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Auto-fix trailing slash for GitHub Pages to ensure relative assets resolve properly -->
    <script>
      (function() {
        var p = window.location.pathname;
        if (!p.endsWith('/') && !p.split('/').pop().includes('.')) {
          window.location.replace(p + '/' + window.location.search + window.location.hash);
        }
      })();
    </script>
  </head>
  <body class="bg-slate-900 text-slate-800 antialiased font-sans">
    <div id="root">
      <!-- Branded Loading Screen to prevent blank white screen on GitHub Pages -->
      <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at top left, #1e1b4b, #0f172a 70%); font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; color: #f8fafc; padding: 20px;">
        <div style="background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 24px; padding: 32px 28px; max-width: 420px; width: 100%; text-align: center; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);">
          <div style="width: 58px; height: 58px; margin: 0 auto 16px; border-radius: 18px; background: linear-gradient(135deg, #2563eb, #4f46e5); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.5);">
            <svg style="width: 30px; height: 30px; fill: none; stroke: #ffffff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;" viewBox="0 0 24 24">
              <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
              <path d="M6 12v5c3 3 9 3 12 0v-5"/>
            </svg>
          </div>
          <h1 style="font-size: 19px; font-weight: 800; margin: 0 0 6px; color: #ffffff; letter-spacing: -0.02em;">Agenda Surat Sekolah</h1>
          <p style="font-size: 13px; color: #94a3b8; margin: 0 0 22px; line-height: 1.5;">Menyiapkan antarmuka dan basis data kearsipan lokal...</p>
          <div style="width: 36px; height: 36px; margin: 0 auto; border: 3px solid rgba(255,255,255,0.18); border-top-color: #38bdf8; border-radius: 50%; animation: spinLoader 0.9s linear infinite;"></div>
          <style>
            @keyframes spinLoader { to { transform: rotate(360deg); } }
          </style>
          <div id="github-diag-msg" style="display: none; margin-top: 20px; padding: 14px; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.35); border-radius: 14px; font-size: 12px; color: #fca5a5; text-align: left; line-height: 1.5;">
            Proses memuat memakan waktu lebih lama dari biasanya.
            <button onclick="window.location.reload()" style="display: block; width: 100%; margin-top: 10px; padding: 9px; background: #2563eb; color: #ffffff; border: none; border-radius: 10px; font-weight: 700; cursor: pointer;">Muat Ulang Halaman</button>
          </div>
          <script>
            setTimeout(function() {
              var el = document.getElementById('github-diag-msg');
              if (el && document.getElementById('root') && document.getElementById('root').contains(el)) {
                el.style.display = 'block';
              }
            }, 5000);
          </script>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
