<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <title>Agenda Surat Sekolah - Mengalihkan...</title>
    <script>
      // Single Page Application redirect script for GitHub Pages
      // Redirects 404s back to index.html with the route path encoded
      (function() {
        var segmentCount = 1;
        var location = window.location;
        var pathname = location.pathname;
        
        // If repo subpath exists, preserve it
        location.replace(
          location.protocol + '//' + location.hostname + (location.port ? ':' + location.port : '') +
          pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' +
          pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
          (location.search ? '&q=' + location.search.slice(1).replace(/&/g, '~and~') : '') +
          location.hash
        );
      })();
    </script>
  </head>
  <body style="background: #0f172a; color: #94a3b8; font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0;">
    <p>Mengalihkan ke aplikasi Agenda Surat Sekolah...</p>
  </body>
</html>
